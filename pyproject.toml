[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photosorter"
version = "0.1.0"
description = "Local-only photo sorting with an Immich-ready export"
requires-python = ">=3.11"
dependencies = [
    "pillow==13.0.0",
    "pillow-heif==1.8.1",
    "piexif==1.1.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
faces = ["insightface"]

[project.scripts]
photosorter = "photosorter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
